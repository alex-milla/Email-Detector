version: "3.9"

services:
  email-detector:
    build: .
    container_name: email-detector
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config:/opt/email-detector/config
      - ./data:/opt/email-detector/data
      - ./models:/opt/email-detector/models
      - ./results:/opt/email-detector/results
      - ./logs:/opt/email-detector/logs
    environment:
      - SECRET_KEY=${SECRET_KEY:-cambiame_en_produccion}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
      - EMAIL_DETECTOR_RELAX_SCRIPT_CHECK=1
